apiVersion: v1
kind: Service
metadata:
  name: clinicflow-backend
  namespace: clinicflow
  labels:
    app: clinicflow-backend
spec:
  selector:
    app: clinicflow-backend
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: clinicflow-frontend
  namespace: clinicflow
  labels:
    app: clinicflow-frontend
spec:
  selector:
    app: clinicflow-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
