# Grafana dashboard for ClinicFlow, auto-loaded by the Grafana sidecar.
#
# The label below is what the kube-prometheus-stack Grafana sidecar watches,
# so simply applying this file makes the dashboard appear in Grafana.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clinicflow-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  clinicflow-dashboard.json: |
    {
      "title": "ClinicFlow — Application Metrics",
      "uid": "clinicflow-main",
      "tags": ["clinicflow", "fastapi"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "type": "stat",
          "title": "HTTP request rate (req/s)",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=~\".*clinicflow.*\"}[5m]))",
              "legendFormat": "req/s"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Total requests served",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "sum(http_requests_total{job=~\".*clinicflow.*\"})",
              "legendFormat": "total"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requests by endpoint",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum by (handler) (rate(http_requests_total{job=~\".*clinicflow.*\"}[5m]))",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "p95 request latency (seconds)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=~\".*clinicflow.*\"}[5m])))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Responses by status code",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total{job=~\".*clinicflow.*\"}[5m]))",
              "legendFormat": "{{status}}"
            }
          ]
        }
      ]
    }
